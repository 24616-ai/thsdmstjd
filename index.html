<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ AI 감성 자동 일기장</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: 'Malgun Gothic', Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      color: #1e88e5;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    /* 인증 섹션 */
    .auth-box {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h2 { margin-top: 0; font-size: 22px; text-align: center; color: #555; }

    input, select, textarea {
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #42a5f5;
      box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
    }

    textarea { min-height: 120px; resize: vertical; font-family: inherit; }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
    }

    button:hover { transform: translateY(-2px); opacity: 0.9; }
    button:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }

    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: #455a64; color: white; height: 38px; }
    .ai-btn { background: #ff7043; color: white; }
    .save-btn { background: #66bb6a; color: white; }
    .tts-btn { background: #26a69a; color: white; }
    .clear-btn { background: #b0bec5; color: white; }
    .edit-btn { background: #ffca28; color: #333; }
    .delete-btn { background: #ef5350; color: white; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      padding: 14px;
      border-radius: 16px;
      background: #f7f9fb;
    }

    .user-info { font-size: 14px; color: #555; }
    .status { min-height: 24px; margin-bottom: 14px; color: #666; font-size: 14px; font-style: italic; text-align: center;}
    .notice { max-width: 420px; margin: 20px auto 0; padding: 14px; border-radius: 14px; background: #fff8e1; color: #6d4c41; font-size: 13px; line-height: 1.6; }

    /* 메인 에디터 구성 */
    .editor-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .panel-title { font-weight: bold; margin-bottom: 8px; color: #444; display: flex; align-items: center; gap: 5px; }
    .option-row { display: flex; gap: 8px; margin-bottom: 8px; }

    .result-box {
      background: #f8f9fa;
      border: 1px dashed #42a5f5;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 일기 리스트 */
    .list { display: flex; flex-direction: column; gap: 14px; }
    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 18px;
      border-radius: 16px;
      background: #fdfdfd;
      border: 1px solid #eef2f5;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }
    .item-title { margin: 0 0 6px; font-size: 18px; font-weight: bold; color: #1565c0; }
    .item-content { margin: 0; color: #444; line-height: 1.6; white-space: pre-wrap; }
    .item-date { margin-top: 8px; font-size: 12px; color: #aaa; }
    .item-actions { display: flex; gap: 6px; flex-direction: column; }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .editor-section { grid-template-columns: 1fr; }
      .item { grid-template-columns: 1fr; }
      .item-actions { flex-direction: row; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ AI 감성 자동 일기장</h1>
    <div class="subtitle">오늘의 파편들을 AI가 아름다운 한 편의 음악 소리 일기로 다듬어 드립니다.</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>로그인 / 회원가입</h2>
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">새로 회원가입</button>
      </div>
      <div class="notice">
        처음 사용하시는 계정이라면 <strong>회원가입</strong>을 먼저 진행해 주세요.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">✍️ <strong><span id="userEmail"></span></strong> 님의 일기장 공간</div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="editor-section">
        <div>
          <div class="panel-title">✏️ 오늘의 이야기 들려주기</div>
          <textarea id="rawContentInput" placeholder="오늘 어떤 일이 있었나요? 감정이나 겪었던 단어들을 자유롭게 브레인스토밍하듯 적어보세요. (예: 오늘 친구와 오랜만에 명동에서 만남. 비가 왔지만 카페에서 수다 떨어 행복했음)"></textarea>
          <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button class="clear-btn" style="flex: 1;" id="clearBtn">지우기</button>
            <button class="ai-btn" style="flex: 2;" id="generateAiBtn">🪄 AI 일기 변환하기</button>
          </div>
        </div>

        <div class="result-box">
          <div class="panel-title">🤖 AI 추천 및 다듬기 결과</div>
          <input id="aiTitleInput" type="text" placeholder="AI가 만든 제목이 여기에 표시됩니다." />
          <textarea id="aiContentInput" style="min-height: 140px;" placeholder="AI가 다듬은 풍부한 감성의 일기장이 완성되는 공간입니다. 자유롭게 직접 수정도 가능합니다."></textarea>
          
          <div class="option-row">
            <select id="voiceSelect" style="flex: 1; height: 38px; padding: 0 8px; font-size: 13px;">
              <option value="nova">Nova (부드러운 여성음)</option>
              <option value="alloy">Alloy (중성적이고 단정한 음성)</option>
              <option value="shimmer">Shimmer (맑은 여성음)</option>
              <option value="onyx">Onyx (차분한 남성음)</option>
              <option value="echo">Echo (밀도 있는 남성음)</option>
            </select>
            <button class="tts-btn" style="height: 38px; padding: 0 12px; font-size: 13px;" id="ttsBtn">🔊 음성 듣기</button>
          </div>
          <audio id="audioPlayer" controls class="hidden" style="width: 100%;"></audio>
          <button class="save-btn" id="saveBtn">💾 이 일기를 내 일기장에 저장</button>
        </div>
      </div>

      <hr style="border: 0; height: 1px; background: #ddd; margin: 24px 0;" />
      
      <div class="panel-title" style="font-size: 20px; color: #455a64; margin-bottom: 12px;">📚 저장된 지난 기록 타임라인</div>
      <div id="status" class="status"></div>
      <div id="dataList" class="list"></div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, remove, onValue, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // Firebase 구성 정보 설정
    const firebaseConfig = {
      apiKey: "AIzaSyCnitaC9UgtTcr54ljINOI0O9xEK4PTYG4",
      authDomain: "gangt-ae7af.firebaseapp.com",
      databaseURL: "https://gangt-ae7af-default-rtdb.firebaseio.com",
      projectId: "gangt-ae7af",
      storageBucket: "gangt-ae7af.firebasestorage.app",
      messagingSenderId: "7342109039",
      appId: "1:7342109039:web:04b8d41c4735039f9e789a",
      measurementId: "G-TN82ET5KHV"
    };

    // Google Apps Script 웹앱 배포 URL 주소를 기입하세요
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxG2JWHnfIKvjiCRf3rcrqNxfBBo5cdoE8x3o5AtOYTdpNdrGVPxmnPfoW9uvM_BwqH/exec';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // DOM 요소 캐싱
    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');

    const rawContentInput = document.getElementById('rawContentInput');
    const aiTitleInput = document.getElementById('aiTitleInput');
    const aiContentInput = document.getElementById('aiContentInput');
    const generateAiBtn = document.getElementById('generateAiBtn');
    const clearBtn = document.getElementById('clearBtn');
    const voiceSelect = document.getElementById('voiceSelect');
    const ttsBtn = document.getElementById('ttsBtn');
    const audioPlayer = document.getElementById('audioPlayer');
    const saveBtn = document.getElementById('saveBtn');
    const dataList = document.getElementById('dataList');
    const statusBox = document.getElementById('status');

    let currentUser = null;
    let currentItemsRef = null;

    function setStatus(msg) { statusBox.textContent = msg; }

    // === 1. Authentication (로그인/회원가입) 처리 ===
    signupBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if(!validateAuth(email, password)) return;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert('회원가입 및 로그인이 완료되었습니다!');
      } catch (e) { alert(getKoreanErrorMessage(e.code)); }
    });

    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if(!validateAuth(email, password)) return;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) { alert(getKoreanErrorMessage(e.code)); }
    });

    logoutBtn.addEventListener('click', () => signOut(auth).catch(() => alert('로그아웃 실패')));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        userEmail.textContent = user.email;
        clearInputs();
        startRealtimeListener(user.uid);
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
        if(currentItemsRef) off(currentItemsRef);
        dataList.innerHTML = '';
      }
    });

    function validateAuth(email, password) {
      if(!email || !password) { alert('이메일과 패스워드를 적어주세요.'); return false; }
      if(password.length < 6) { alert('비밀번호는 최소 6자 이상입니다.'); return false; }
      return true;
    }

    // === 2. AI 대듬기 및 생성형 AI 연동 (handleChat 호출) ===
    generateAiBtn.addEventListener('click', async () => {
      const text = rawContentInput.value.trim();
      if(!text) { alert('AI가 일기를 지을 수 있도록 오늘 하루 조각들을 조금만 적어주세요.'); return; }

      try {
        setAiLoading(true);
        setStatus('✨ AI 작가가 문장을 이쁘게 다듬는 중입니다...');
        
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ type: 'chat', question: text, model: 'gpt-4o-mini' })
        });
        const data = await res.json();
        if(data.error) throw new Error(data.error);

        parseAndDisplayDiary(data.answer);
        setStatus('✨ 일기 생성 성공! 마음에 들면 하단 저장 또는 오디오를 청취하세요.');
      } catch (err) {
        console.error(err);
        alert('AI 생성 실패: ' + err.message);
        setStatus('생성 오류 발생.');
      } finally {
        setAiLoading(false);
      }
    });

    function parseAndDisplayDiary(aiText) {
      // "제목: 내용", "일기: 내용" 구조 파싱 처리
      const lines = aiText.split('\n');
      let title = "오늘의 일기";
      let content = aiText;

      lines.forEach(line => {
        if(line.startsWith('제목:')) title = line.replace('제목:', '').trim();
        if(line.startsWith('일기:')) content = line.replace('일기:', '').trim();
      });

      aiTitleInput.value = title;
      aiContentInput.value = content;
    }

    function setAiLoading(isLoading) {
      generateAiBtn.disabled = isLoading;
      generateAiBtn.textContent = isLoading ? '🪄 일기 다듬는 중...' : '🪄 AI 일기 변환하기';
    }

    // === 3. TTS (텍스트 음성 변환) 연동 ===
    ttsBtn.addEventListener('click', async () => {
      const textToSpeak = aiContentInput.value.trim();
      if(!textToSpeak) { alert('음성으로 들을 일기장 본문이 비어있습니다.'); return; }

      try {
        ttsBtn.disabled = true;
        ttsBtn.textContent = '🔊 목소리 녹음 중...';
        audioPlayer.classList.add('hidden');

        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            type: 'tts',
            text: textToSpeak,
            voice: voiceSelect.value,
            model: 'tts-1',
            speed: 1.0
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const audioUrl = base64ToAudioUrl(data.audioBase64, 'audio/mpeg');
        audioPlayer.src = audioUrl;
        audioPlayer.classList.remove('hidden');
        audioPlayer.play();
        ttsBtn.textContent = '🔊 음성 재생 중';
      } catch (err) {
        console.error(err);
        alert('음성 파일 추출 실패: ' + err.message);
      } finally {
        ttsBtn.disabled = false;
        if(audioPlayer.src === "") ttsBtn.textContent = '🔊 음성 듣기';
      }
    });

    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) byteNumbers[i] = slice.charCodeAt(i);
        byteArrays.push(new Uint8Array(byteNumbers));
      }
      return URL.createObjectURL(new Blob(byteArrays, { type: mimeType }));
    }

    // === 4. Firebase 실시간 데이터 연동 (CRUD) ===
    saveBtn.addEventListener('click', async () => {
      if(!currentUser) return;
      const title = aiTitleInput.value.trim();
      const content = aiContentInput.value.trim();

      if(!title || !content) {
        alert('저장할 일기 제목과 본문 내용이 채워져 있어야 합니다.');
        return;
      }

      try {
        const itemsRef = ref(database, `users/${currentUser.uid}/items`);
        await push(itemsRef, {
          title,
          content,
          createdAt: new Date().toLocaleString('ko-KR')
        });
        alert('내 일기장에 안전하게 기록되었습니다.');
        clearInputs();
      } catch (e) { alert('데이터 저장 오류'); }
    });

    function startRealtimeListener(uid) {
      setStatus('데이터 연동 동기화 중...');
      currentItemsRef = ref(database, `users/${uid}/items`);
      onValue(currentItemsRef, (snapshot) => {
        renderData(snapshot.val());
        setStatus('모든 기록이 최신 상태로 동기화되었습니다.');
      });
    }

    window.deleteDiary = async function(id) {
      if(!currentUser || !confirm('이 일기 기록을 정말 영구 삭제하시겠습니까?')) return;
      try {
        await remove(ref(database, `users/${currentUser.uid}/items/${id}`));
      } catch (e) { alert('삭제 처리에 실패했습니다.'); }
    };

    // 타임라인 데이터 렌더링
    function renderData(data) {
      dataList.innerHTML = '';
      if(!data) {
        dataList.innerHTML = '<div class="empty" style="text-align:center; color:#888; padding:30px;">아직 일기장에 쓰인 추억 기록이 없습니다. 첫 일기를 남겨보세요!</div>';
        return;
      }

      Object.entries(data).reverse().forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div>
            <p class="item-title">${escapeHTML(item.title || '')}</p>
            <p class="item-content">${escapeHTML(item.content || '')}</p>
            <div class="item-date">📅 작성 시각: ${item.createdAt || '-'}</div>
          </div>
          <div class="item-actions">
            <button class="tts-btn" style="height:32px; font-size:12px; padding:0 8px;" onclick="listenArchiveDiary('${escapeForAttribute(item.content || '')}')">🔊 듣기</button>
            <button class="delete-btn" style="height:32px; font-size:12px; padding:0 8px;" onclick="deleteDiary('${id}')">삭제</button>
          </div>
        `;
        dataList.appendChild(div);
      });
    }

    // 아카이브 리스트 내에서 직접 음성 듣기 버튼 구현
    window.listenArchiveDiary = async function(content) {
      aiContentInput.value = content;
      aiTitleInput.value = "기존 저장 일기 읽기";
      ttsBtn.click();
    };

    // 보조 함수들
    clearBtn.addEventListener('click', clearInputs);
    function clearInputs() {
      rawContentInput.value = '';
      aiTitleInput.value = '';
      aiContentInput.value = '';
      audioPlayer.classList.add('hidden');
      audioPlayer.removeAttribute('src');
      ttsBtn.textContent = '🔊 음성 듣기';
    }

    function escapeHTML(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    function escapeForAttribute(text) {
      return escapeHTML(text).replaceAll('`', '&#096;').replaceAll('\n', ' ');
    }

    function getKoreanErrorMessage(code) {
      switch (code) {
        case 'auth/email-already-in-use': return '이미 사용 중인 이메일 주소입니다.';
        case 'auth/invalid-email': return '이메일 주소의 형태가 올바르지 않습니다.';
        case 'auth/weak-password': return '보안 강도가 낮습니다. 비밀번호를 6자리 이상 설정하세요.';
        case 'auth/user-not-found': return '등록되지 않은 계정입니다.';
        case 'auth/wrong-password': return '비밀번호를 다시 한 번 확인해 주세요.';
        default: return `에러 발생: ${code}`;
      }
    }
  </script>
</body>
</html>
